    <line x1="362" y1="106" x2="396" y2="106"/>
    <line x1="546" y1="106" x2="580" y2="106"/>
    <line x1="730" y1="106" x2="764" y2="106"/>
    <line x1="914" y1="106" x2="948" y2="106"/>
